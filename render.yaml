services:
  - type: web
    name: grok2api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: GROK2API_ADMIN_USERNAME
        value: admin
      - key: GROK2API_ADMIN_PASSWORD
        value: "7876753858"
      - key: GROK2API_JWT_SECRET
        value: "4623233056166df1e2c96bcd9e09051ecad9334646a60fd550effc9a7a3fff54"
      - key: GROK2API_CREDENTIAL_ENCRYPTION_KEY
        value: "aCY9pOMBUjvM5afTXWpacGazpsqijAWqUb952QuBigk="
      # If using Render PostgreSQL, connect it automatically:
      - key: GROK2API_DATABASE_URL
        fromDatabase:
          name: grok2api-postgres
          property: connectionString

databases:
  - name: grok2api-postgres
    databaseName: grok2api
    user: grok2api
    plan: free
    region: oregon
